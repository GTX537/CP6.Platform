x-cp6-p09-fixture-build: &cp6-p09-fixture-build
  context: ../../..
  dockerfile: tests/CP6.Platform.P09Fixture/Dockerfile

x-cp6-p09-runtime-ownership:
  schema-version: "1"
  outer-directory-mode: "0700"
  population-directory-mode: "0733"
  bind-directory-mode: "0711"
  file-mode: "0600"
  population-method: target-uid-stdin
  population-image: apache/kafka:4.3.1
  targets:
    kafka:
      uid: "1000"
      gid: "1000"
      mount-sources:
        - kafka/config
        - kafka/secrets
        - kafka/clients
    kafka-admin:
      uid: "1000"
      gid: "1000"
      mount-sources:
        - kafka/clients
    publisher-dapr:
      uid: "65532"
      gid: "65532"
      mount-sources:
        - dapr/publisher/components
        - dapr/publisher/secrets
    receiver-dapr:
      uid: "65532"
      gid: "65532"
      mount-sources:
        - dapr/receiver/components
        - dapr/receiver/secrets
    unauthorized-dapr:
      uid: "65532"
      gid: "65532"
      mount-sources:
        - dapr/unauthorized/components
        - dapr/unauthorized/secrets

services:
  kafka:
    image: apache/kafka:4.3.1
    user: "1000:1000"
    environment:
      CLUSTER_ID: ${CP6_P09_CLUSTER_ID:?CP6_P09_CLUSTER_ID must be set}
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/kafka-jaas.conf
    volumes:
      - type: bind
        source: ${CP6_P09_RUNTIME_ROOT:?CP6_P09_RUNTIME_ROOT must be set}/kafka/config
        target: /mnt/shared/config
        read_only: true
      - type: bind
        source: ${CP6_P09_RUNTIME_ROOT:?CP6_P09_RUNTIME_ROOT must be set}/kafka/secrets
        target: /etc/kafka/secrets
        read_only: true
      - type: bind
        source: ${CP6_P09_RUNTIME_ROOT:?CP6_P09_RUNTIME_ROOT must be set}/kafka/clients
        target: /etc/kafka/clients
        read_only: true
      - type: volume
        source: kafka-data
        target: /var/lib/kafka/data
    networks:
      runtime: {}
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-metadata-quorum.sh
        - --bootstrap-controller
        - localhost:9093
        - --command-config
        - /etc/kafka/clients/readiness.properties
        - describe
        - --status
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  publisher:
    build: *cp6-p09-fixture-build
    command: ["publisher"]
    environment:
      ASPNETCORE_URLS: http://+:8080
      DAPR_HTTP_ENDPOINT: http://publisher-dapr:3500
      DAPR_GRPC_ENDPOINT: http://publisher-dapr:50001
    ports:
      - "127.0.0.1:${CP6_P09_HOST_PORT:-0}:8080"
    networks:
      publisher-app: {}

  publisher-dapr:
    image: daprio/daprd:1.18.2
    user: "65532:65532"
    entrypoint: ["/daprd"]
    command:
      - --app-id
      - cp6-p09-probe-publisher
      - --app-port
      - "8080"
      - --app-channel-address
      - publisher
      - --dapr-http-port
      - "3500"
      - --dapr-grpc-port
      - "50001"
      - --resources-path
      - /components
      - --log-level
      - warn
    volumes:
      - type: bind
        source: ${CP6_P09_RUNTIME_ROOT:?CP6_P09_RUNTIME_ROOT must be set}/dapr/publisher/components
        target: /components
        read_only: true
      - type: bind
        source: ${CP6_P09_RUNTIME_ROOT:?CP6_P09_RUNTIME_ROOT must be set}/dapr/publisher/secrets
        target: /run/cp6-p09/secrets
        read_only: true
    networks:
      runtime:
        interface_name: eth0
        gw_priority: 1
      publisher-app:
        interface_name: eth1
        gw_priority: 0
    depends_on:
      kafka:
        condition: service_healthy
      publisher:
        condition: service_started

  receiver:
    build: *cp6-p09-fixture-build
    command: ["receiver"]
    environment:
      ASPNETCORE_URLS: http://+:8080
      DAPR_HTTP_ENDPOINT: http://receiver-dapr:3500
      DAPR_GRPC_ENDPOINT: http://receiver-dapr:50001
    networks:
      receiver-app: {}

  receiver-dapr:
    image: daprio/daprd:1.18.2
    user: "65532:65532"
    entrypoint: ["/daprd"]
    command:
      - --app-id
      - cp6-p09-probe-receiver
      - --app-port
      - "8080"
      - --app-channel-address
      - receiver
      - --dapr-http-port
      - "3500"
      - --dapr-grpc-port
      - "50001"
      - --resources-path
      - /components
      - --log-level
      - warn
    volumes:
      - type: bind
        source: ${CP6_P09_RUNTIME_ROOT:?CP6_P09_RUNTIME_ROOT must be set}/dapr/receiver/components
        target: /components
        read_only: true
      - type: bind
        source: ${CP6_P09_RUNTIME_ROOT:?CP6_P09_RUNTIME_ROOT must be set}/dapr/receiver/secrets
        target: /run/cp6-p09/secrets
        read_only: true
    networks:
      runtime:
        interface_name: eth0
        gw_priority: 1
      receiver-app:
        interface_name: eth1
        gw_priority: 0
    depends_on:
      kafka:
        condition: service_healthy
      receiver:
        condition: service_started

  direct-probe:
    build: *cp6-p09-fixture-build
    command: ["${CP6_P09_NEGATIVE_ROLE:-probe}"]
    profiles: ["negative"]
    environment:
      ASPNETCORE_URLS: http://+:8080
      DAPR_HTTP_ENDPOINT: http://unauthorized-dapr:3500
      DAPR_GRPC_ENDPOINT: http://unauthorized-dapr:50001
    networks:
      unauthorized-app: {}

  unauthorized-dapr:
    image: daprio/daprd:1.18.2
    user: "65532:65532"
    entrypoint: ["/daprd"]
    command:
      - --app-id
      - cp6-p09-unauthorized-probe
      - --app-port
      - "8080"
      - --app-channel-address
      - direct-probe
      - --dapr-http-port
      - "3500"
      - --dapr-grpc-port
      - "50001"
      - --resources-path
      - /components
      - --log-level
      - warn
    profiles: ["negative"]
    volumes:
      - type: bind
        source: ${CP6_P09_RUNTIME_ROOT:?CP6_P09_RUNTIME_ROOT must be set}/dapr/unauthorized/components
        target: /components
        read_only: true
      - type: bind
        source: ${CP6_P09_RUNTIME_ROOT:?CP6_P09_RUNTIME_ROOT must be set}/dapr/unauthorized/secrets
        target: /run/cp6-p09/secrets
        read_only: true
    networks:
      runtime:
        interface_name: eth0
        gw_priority: 1
      unauthorized-app:
        interface_name: eth1
        gw_priority: 0
    depends_on:
      kafka:
        condition: service_healthy
      direct-probe:
        condition: service_started

  kafka-admin:
    image: apache/kafka:4.3.1
    user: "1000:1000"
    command: ["/bin/true"]
    profiles: ["provision"]
    volumes:
      - type: bind
        source: ${CP6_P09_RUNTIME_ROOT:?CP6_P09_RUNTIME_ROOT must be set}/kafka/clients
        target: /etc/kafka/clients
        read_only: true
    networks:
      runtime: {}
    depends_on:
      kafka:
        condition: service_healthy

networks:
  publisher-app:
  receiver-app:
  unauthorized-app:
  runtime:

volumes:
  kafka-data:
