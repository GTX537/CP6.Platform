services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  publisher:
    build:
      context: ../..
      dockerfile: tests/p05/Dockerfile
    environment:
      CP6_P05_ROLE: publisher
      CP6_CONTRACT_ROOT: /contracts
      DAPR_HTTP_ENDPOINT: http://publisher-dapr:3500
      DAPR_GRPC_ENDPOINT: http://publisher-dapr:50001
    ports:
      - "8080"

  publisher-dapr:
    image: daprio/daprd:1.18.2
    entrypoint: ["/daprd"]
    command:
      - --app-id
      - cp6-p05-publisher
      - --app-port
      - "8080"
      - --app-channel-address
      - publisher
      - --dapr-http-port
      - "3500"
      - --dapr-grpc-port
      - "50001"
      - --resources-path
      - /components
      - --log-level
      - warn
    volumes:
      - ./components:/components:ro
    depends_on:
      kafka:
        condition: service_healthy
      publisher:
        condition: service_started

  receiver:
    build:
      context: ../..
      dockerfile: tests/p05/Dockerfile
    environment:
      CP6_P05_ROLE: receiver
      CP6_CONTRACT_ROOT: /contracts
      DAPR_HTTP_ENDPOINT: http://receiver-dapr:3500
      DAPR_GRPC_ENDPOINT: http://receiver-dapr:50001
    ports:
      - "8080"

  receiver-dapr:
    image: daprio/daprd:1.18.2
    entrypoint: ["/daprd"]
    command:
      - --app-id
      - cp6-p05-receiver
      - --app-port
      - "8080"
      - --app-channel-address
      - receiver
      - --dapr-http-port
      - "3500"
      - --dapr-grpc-port
      - "50001"
      - --resources-path
      - /components
      - --log-level
      - warn
    volumes:
      - ./components:/components:ro
    depends_on:
      kafka:
        condition: service_healthy
      receiver:
        condition: service_started
