name: platform-validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Verify format
        shell: pwsh
        run: ./eng/verify.ps1 -Gate Format -Profile ci
      - name: Verify build
        shell: pwsh
        run: ./eng/verify.ps1 -Gate Build -Profile ci
      - name: Verify unit tests
        shell: pwsh
        run: ./eng/verify.ps1 -Gate Unit -Profile ci
      - name: Verify ASP.NET integration
        shell: pwsh
        run: ./eng/verify.ps1 -Gate Integration -Profile ci
      - name: Verify package contracts
        shell: pwsh
        run: ./eng/verify.ps1 -Gate Contract -Profile ci
      - name: Verify dependency security
        shell: pwsh
        run: ./eng/verify.ps1 -Gate Security -Profile ci
      - name: Record non-applicable gates
        shell: pwsh
        run: |
          ./eng/verify.ps1 -Gate E2E -Profile ci
          ./eng/verify.ps1 -Gate Performance -Profile ci
          ./eng/verify.ps1 -Gate Migration -Profile ci
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-verification-${{ matrix.os }}
          path: artifacts/verify/**
          if-no-files-found: error
          retention-days: 7

  dapr-kafka:
    name: ubuntu-dapr-kafka
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Verify real Dapr and Kafka integration
        shell: pwsh
        run: ./eng/verify.ps1 -Gate Integration -Profile p05-real
      - name: Preserve Dapr and Kafka evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p05-dapr-kafka-integration
          path: artifacts/**
          if-no-files-found: error
          retention-days: 7

  sql-server:
    name: ubuntu-sql-server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Verify real SQL Server transactional messaging
        shell: pwsh
        run: ./eng/verify.ps1 -Gate Integration -Profile p06-real
      - name: Preserve SQL Server evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p06-sql-server-integration
          path: artifacts/**
          if-no-files-found: error
          retention-days: 7
